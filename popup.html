<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clip'n'Note</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="popup">

  <div class="clips">
    <label class="vh" for="q">Search your notes</label>
    <input id="q" type="text" placeholder="Search" autocomplete="off" spellcheck="false">

    <div class="listwrap">
      <div class="list" id="list" role="list"></div>
    </div>

    <div class="footline">
      <span class="count" id="count"></span>
      <button type="button" class="padhits" id="padHits" hidden></button>
    </div>

    <div class="undo" id="undo" role="status" hidden>
      <span id="undoText"></span>
      <button type="button" id="undoBtn">Undo</button>
    </div>

    <button type="button" id="new" class="primary">New note</button>
  </div>

  <div class="pad">
    <label class="vh" for="notePad">Notes</label>
    <textarea id="notePad" placeholder="Notes" spellcheck="false"></textarea>

    <div class="detail" id="detail" hidden>
      <div class="head">
        <label class="vh" for="openName">Name</label>
        <input id="openName" type="text" class="name" placeholder="Untitled"
               autocomplete="off" spellcheck="false">
      </div>
      <label class="vh" for="openBody">Content</label>
      <textarea id="openBody" spellcheck="false"></textarea>
      <div class="state" id="openState" hidden>Not saved</div>
    </div>
  </div>

</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="script.js"></script>
</body>
</html>
